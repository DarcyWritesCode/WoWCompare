name: Benchmarks

# Every two hours: rebuilds the one spec whose weekly slot it is (src/wowcompare/benchmarks/
# schedule.ts), or in a free slot the stalest spec. For every Heroic and Mythic boss of the current raid
# it parses the #1 and the logs around the 90th percentile and publishes them to Cloudflare KV for
# Live Compare. See scripts/benchmarks/README.md.
on:
  schedule:
    # Keep in step with SLOT_HOURS, SLOT_MINUTE and SLOTS_PER_DAY in schedule.ts (shown on the
    # specs page).
    - cron: '47 0-10/2 * * *'
  workflow_dispatch:
    inputs:
      args:
        description: 'Extra job arguments, e.g. --spec Druid --spec Evoker --all, or --spec Druid:Feral --difficulty 5'
        required: false
        default: ''

permissions:
  contents: read
  # To start a deploy after the job first binds the KV namespace to the Pages project.
  actions: write

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  benchmarks:
    name: 'Build benchmarks'
    runs-on: ubuntu-24.04
    # GitHub's limit is 360. The job stops parsing at --max-minutes: 110 by default, so a run ends
    # before the next slot; a manual --all run can pass up to 330.
    timeout-minutes: 355
    if: github.repository == 'DarcyWritesCode/WoWCompare'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run benchmarks:typecheck
      - run: pnpm run benchmarks:build
        env:
          DISABLE_CHECKER_PLUGIN: true
      # Logs parsed on earlier runs, so a rebuild only parses logs that are new to the reference.
      - uses: actions/cache/restore@v4
        with:
          path: node_modules/.cache/wc-benchmarks-cache
          key: wc-benchmarks-${{ github.run_id }}
          restore-keys: wc-benchmarks-
      - id: run
        run: pnpm run benchmarks:run $ARGS
        env:
          # Scheduled runs take BENCHMARK_ARGS (a repository variable), e.g. `--first Druid` to
          # choose the order of a first release.
          ARGS: ${{ inputs.args || vars.BENCHMARK_ARGS }}
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # For the SimC commit dates on the specs page (GitHub's API limit is higher with a token).
          GITHUB_TOKEN: ${{ github.token }}
      - if: steps.run.outputs.redeploy == 'true'
        run: gh workflow run deploy-pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: node_modules/.cache/wc-benchmarks-cache
          key: wc-benchmarks-${{ github.run_id }}
