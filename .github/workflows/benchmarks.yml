name: Benchmarks

# Every two hours from 00:47 UTC: rebuilds the one spec whose weekly slot it is
# (src/wowcompare/benchmarks/schedule.ts), or in a free slot the stalest spec, parsing the #1 and
# the reference logs (90-95th percentile) for every Heroic and Mythic boss of the current raid.
# Sundays at 13:17 UTC: a collector run parses extra logs to measure buff effects. Everything is
# published to Cloudflare KV for Live Compare. See scripts/benchmarks/README.md.
on:
  schedule:
    # Keep in step with SLOT_HOURS, SLOT_MINUTE and SLOTS_PER_DAY in schedule.ts (shown on the
    # specs page).
    - cron: '47 0-10/2 * * *'
    # After Sunday's builds: one long collector run (`--collect`) a week, parsing extra logs for
    # buff effects only. It was hourly; weekly cuts the job's runner minutes by about 90%.
    - cron: '17 13 * * 0'
  workflow_dispatch:
    inputs:
      args:
        description: 'Extra job arguments, e.g. --spec Druid --spec Evoker --all, or --spec Druid:Feral --difficulty 5'
        required: false
        default: ''

permissions:
  contents: read
  # To start a deploy after the job first binds the KV namespace to the Pages project.
  actions: write

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  benchmarks:
    name: 'Build benchmarks'
    runs-on: ubuntu-24.04
    # GitHub's limit is 360. The job stops parsing at --max-minutes: 110 by default, so a run ends
    # before the next slot; a manual --all run can pass up to 330.
    timeout-minutes: 355
    if: github.repository == 'DarcyWritesCode/WoWCompare'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run benchmarks:typecheck
      - run: pnpm run benchmarks:build
        env:
          DISABLE_CHECKER_PLUGIN: true
      # Logs parsed on earlier runs, so a rebuild only parses logs that are new to the reference.
      - uses: actions/cache/restore@v6.1.0
        with:
          path: node_modules/.cache/wc-benchmarks-cache
          key: wc-benchmarks-${{ github.run_id }}
          restore-keys: wc-benchmarks-
      - id: run
        run: pnpm run benchmarks:run $ARGS
        env:
          # Collector runs get --collect; other scheduled runs take BENCHMARK_ARGS (a repository
          # variable), e.g. `--first Druid` to choose which stale specs free slots catch up first.
          ARGS: ${{ inputs.args || (github.event.schedule == '17 13 * * 0' && '--collect --max-minutes 300') || vars.BENCHMARK_ARGS }}
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # For the SimC commit dates on the specs page (GitHub's API limit is higher with a token).
          GITHUB_TOKEN: ${{ github.token }}
          # Twelve logs parse at once, and a long Mythic log can take hundreds of MB; Node's
          # default heap (about 4 GB) ran out. The runner has 16 GB.
          NODE_OPTIONS: --max-old-space-size=8192
      - if: steps.run.outputs.redeploy == 'true'
        run: gh workflow run deploy-pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/cache/save@v6.1.0
        if: always()
        with:
          path: node_modules/.cache/wc-benchmarks-cache
          key: wc-benchmarks-${{ github.run_id }}
      # Each run saves a new ~350 MB cache, and only the newest is restored; delete the rest so
      # they don't pile up past the repository's 10 GB of cache storage.
      - if: always()
        run: |
          gh cache list --key wc-benchmarks- --sort created_at --order desc --limit 100 --json id --jq '.[1:][].id' |
            xargs -r -n1 gh cache delete
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
