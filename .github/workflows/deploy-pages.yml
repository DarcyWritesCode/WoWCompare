name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 'Deploy'
    runs-on: ubuntu-24.04
    if: github.repository == 'DarcyWritesCode/WoWCompare'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:pages
        env:
          DISABLE_AUTOMATIC_ESLINT: true
          VITE_VERSION: ${{ github.sha }}
      - run: pnpm dlx wrangler@4.152.0 pages deploy dist --project-name wowcompare --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
